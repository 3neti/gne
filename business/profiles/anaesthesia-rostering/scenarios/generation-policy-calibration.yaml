identifier: ANAESTHESIA-GENERATION-POLICY-CALIBRATION
title: Anaesthesia generation policy calibration
description: Demonstrates complete policy-set coherence, enforcement readiness, period feasibility, explicit operational fallback, and rollback-by-default reporting.
profile: PROFILE-ANAESTHESIA-ROSTERING
lifecycle: LIFECYCLE-ANAESTHESIA-ROSTER-PERIOD
steps:
  - { id: valid-hours, title: Prove a valid orthogonal required-hours combination, operation: verify_policy_coherence }
  - { id: conflicting-hours, title: Reject a contradictory required-hours combination, operation: verify_policy_coherence }
  - { id: holiday-isolation, title: Exclude holiday discovery metadata from enforcement identity, operation: verify_policy_provenance }
  - { id: employment-scope, title: Prove employment policy concerns availability eligibility only, operation: verify_policy_coherence }
  - { id: explicit-availability, title: Prove explicit availability can make a period infeasible, operation: evaluate_period }
  - { id: hard-maximum, title: Prove hard maximum hours can make a period infeasible, operation: evaluate_period }
  - { id: preferred-off, title: Prove preferred-off prohibition reduces eligibility, operation: evaluate_period }
  - { id: hard-consecutive, title: Report unsupported hard consecutive-day enforcement, operation: verify_runtime_coverage }
  - { id: coverage, title: Prove enforcement coverage is deterministic, operation: verify_runtime_coverage }
  - { id: ready, title: Prove a coherent supported policy set is ready for enforcement, operation: verify_policy_coherence }
  - { id: confirmed-unsupported, title: Keep a confirmed unsupported set non-operational, operation: verify_activation }
  - { id: no-mutation, title: Prove candidate preview does not mutate policy or roster state, operation: verify_preview }
  - { id: provisional-fallback, title: Make operational fallback explicit, operation: verify_activation }
  - { id: rollback, title: Preserve rollback-by-default scenario behavior, operation: verify_rollback }
