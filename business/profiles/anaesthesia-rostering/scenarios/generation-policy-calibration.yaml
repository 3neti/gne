identifier: ANAESTHESIA-GENERATION-POLICY-CALIBRATION
title: Anaesthesia generation policy calibration
description: Demonstrates explicit temporal policy resolution, closed choices, no-mutation impact previews, decision evidence, and rollback-by-default reporting.
profile: PROFILE-ANAESTHESIA-ROSTERING
lifecycle: LIFECYCLE-ANAESTHESIA-ROSTER-PERIOD
steps:
  - { id: provisional-set, title: Resolve current provisional policy set, operation: load_policy_calibration }
  - { id: future-exclusion, title: Prove future decisions do not activate early, operation: verify_effective_window }
  - { id: current-activation, title: Prove current confirmed decisions activate, operation: verify_effective_window }
  - { id: expiry, title: Prove expired decisions are ignored, operation: verify_effective_window }
  - { id: revision-order, title: Prove a higher future revision does not hide the current revision, operation: verify_revision_selection }
  - { id: overlap, title: Prove overlapping windows are rejected, operation: verify_window_integrity }
  - { id: fingerprint, title: Prove fingerprints change only at effective transition, operation: verify_policy_provenance }
  - { id: closed-options, title: Prove the department option registry is closed, operation: verify_option_registry }
  - { id: impact-preview, title: Prove impact preview makes no mutation, operation: preview_policy_impact }
  - { id: pending-count, title: Report eight pending department decisions, operation: report_policy_diagnostics }
  - { id: questionnaire, title: Render candidate choices and operational impacts, operation: render_policy_calibration_artifacts }
  - { id: rollback, title: Preserve rollback-by-default scenario behavior, operation: verify_rollback }
