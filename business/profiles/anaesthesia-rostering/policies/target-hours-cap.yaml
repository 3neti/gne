identifier: POLICY-ANAESTHESIA-TARGET-HOURS-CAP
key: target_hours_cap
revision: 1
status: provisional
selected_value: soft_target
effective_date: null
decision_authority: anaesthesia_department
question: Are target hours a soft target, a minimum, or a hard maximum?
generation_impact: quality
provenance: Targets are treated as soft planning targets pending confirmation.
options:
  - { value: soft_target, label: Soft target, description: Hours guide balancing but may be exceeded., impact: Excess is explained or warned., supported: true, parameters: [] }
  - value: hard_maximum
    label: Hard maximum
    description: Hours may not exceed target plus an explicit tolerance.
    impact: Excess beyond tolerance becomes an error.
    supported: true
    parameters:
      - { key: excess_tolerance_hours, label: Excess tolerance hours, type: integer, minimum: 0, required: true }
  - value: hard_minimum
    label: Hard minimum
    description: Hours must reach target minus an explicit tolerance.
    impact: Deficit beyond tolerance becomes an error.
    supported: true
    parameters:
      - { key: minimum_tolerance_hours, label: Minimum tolerance hours, type: integer, minimum: 0, required: true }
  - { value: target_with_authorized_excess, label: Target with authorized excess, description: Excess requires an approval workflow not present in this release., impact: Not available in the current release., supported: false, unsupported_dependencies: [approval_workflow], parameters: [] }
  - { value: target_with_overtime, label: Target with overtime, description: Excess requires a future overtime model., impact: Not available in the current release., supported: false, unsupported_dependencies: [overtime_model], parameters: [] }
  - { value: unresolved, label: Decision pending, description: Target enforcement is not selected., impact: Target compliance remains limited., confirmation_required: false, supported: true, parameters: [] }
